(function(){
  const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
  if(touch)document.body.classList.add('touch');
  document.querySelectorAll('#pad .b').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();if(!K[k])KP[k]=1;K[k]=1;b.classList.add('on');AU.unlock()};
    const off=e=>{e.preventDefault();K[k]=0;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
  });
})();

// ---- drawing helpers (game px space = 2x)
let CAMX=0,CAMY=0;
function gx(){X.setTransform(2,0,0,2,-Math.round(CAMX*2),-Math.round(CAMY*2))}
function nx(){X.setTransform(1,0,0,1,0,0)}
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function RO(x,y,w,h,c,t){t=t||1;R(x,y,w,t,c);R(x,y+h-t,w,t,c);R(x,y,t,h,c);R(x+w-t,y,t,h,c)}
// text at game coords (x,y = top-left in game px). size in native px
function T(s,x,y,c,sz,al){
  nx();X.font=(sz||24)+'px '+FONT;X.textBaseline='top';X.textAlign=al||'left';X.fillStyle=c||'#fff';
  X.fillText(s,Math.round((x-CAMX)*2),Math.round((y-CAMY)*2));gx();
}
function TW(s,sz){nx();X.font=(sz||24)+'px '+FONT;const w=X.measureText(s).width/2;gx();return w}
function wrap(s,maxW,sz){
  const words=String(s).split(' '),out=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;if(TW(t,sz)>maxW&&line){out.push(line);line=w}else line=t}
  if(line)out.push(line);return out;
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const rnd=(a,b)=>a+RNG()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(RNG()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shd(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r=r*(1+f);g=g*(1+f);b=b*(1+f)}else{r=r+(255-r)*f;g=g+(255-g)*f;b=b+(255-b)*f}
  return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}

// =================================================================== CHARACTER SPRITE GENERATOR
const CW=24,CH=30;
const SPR_CACHE={};
function lookKey(l){return[l.a,l.f,l.o,l.oc,l.h,l.c,l.ac].join('.')}
function charSheet(look){
  const k=lookKey(look);if(SPR_CACHE[k])return SPR_CACHE[k];
  const cv=document.createElement('canvas');cv.width=CW*4;cv.height=CH*4;
  const g=cv.getContext('2d');
  for(let d=0;d<4;d++)for(let f=0;f<4;f++){
    const t=document.createElement('canvas');t.width=CW;t.height=CH;const tg=t.getContext('2d');
    drawChar(tg,look,d===3?2:d,f);
    outline(tg,CW,CH);
    if(d===3){g.save();g.translate(CW*f+CW,CH*d);g.scale(-1,1);g.drawImage(t,0,0);g.restore()}
    else g.drawImage(t,CW*f,CH*d);
  }
  SPR_CACHE[k]=cv;return cv;
}
function outline(g,w,h){
  let id;try{id=g.getImageData(0,0,w,h)}catch(e){return}
  const d=id.data,o=new Uint8ClampedArray(d);
  if(!d||!d.length)return;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;if(d[i+3])continue;
    const n=(x>0&&d[i-4+3])||(x<w-1&&d[i+4+3])||(y>0&&d[i-w*4+3])||(y<h-1&&d[i+w*4+3]);
    if(n){o[i]=16;o[i+1]=12;o[i+2]=20;o[i+3]=255}
  }
  id.data.set(o);g.putImageData(id,0,0);
}
// pixel helpers on arbitrary ctx
function pr(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function pe(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));g.fillRect(Math.round(cx-hw),Math.round(cy+y),hw*2+1,1)}}
// dir: 0 down, 1 up, 2 left.  frame 0..3 (0,2 stand  1,3 step)
function drawChar(g,L,dir,fr){
  const A=ANIMALS[L.a]||ANIMALS[0];
  const fur=L.f?FURS[(L.f-1)%FURS.length]:A.fur;
  const furD=shd(fur,-.28),furL=shd(fur,.18),bel=A.bel;
  const cl=CLOTH[L.oc%CLOTH.length],clD=shd(cl,-.3),clL=shd(cl,.25);
  const ac=CLOTH[L.ac%CLOTH.length],acD=shd(ac,-.3);
  const top=TOPS[L.o%TOPS.length],hat=L.h%HATS.length,acc=L.c%ACCS.length;
  const step=fr===1?1:fr===3?-1:0;
  const pants=top==='Overol'?cl:shd(cl,-.5);
  const side=dir===2,up=dir===1,down=dir===0;
  const hx=side?11:12,hy=9;
  const longHead=A.face==='octo';
  // ---------- tail & cape (behind) unless up
  const drawTail=()=>{
    const t=A.tail;
    if(t==='fan'){const c=fur;for(let a=0;a<7;a++){const an=Math.PI*(1.05+a*.15);const ex=12+Math.cos(an)*11,ey=17+Math.sin(an)*12;
      g.strokeStyle=shd(c,-.2);g.lineWidth=3;g.beginPath();g.moveTo(12,17);g.lineTo(ex,ey);g.stroke();pe(g,ex,ey,2,2,'#40c0a0');pr(g,ex-.5|0,ey-.5|0,1,1,'#1a2a80')}return}
    if(up){ // tail visible from behind, centered
      if(t==='huge'){pe(g,12,17,5,7,fur);pe(g,12,15,4,5,furL)}
      else if(t==='bushy'||t==='ring'||t==='stripe'){pe(g,12,22,3,5,t==='stripe'?'#2a2a32':fur);if(t==='ring'){pr(g,10,20,5,1,furD);pr(g,10,23,5,1,furD)}if(t==='stripe')pr(g,11,18,2,8,'#f4f4f4');if(A.tip)pe(g,12,26,2,1,A.tip)}
      else if(t==='thin'||t==='pink'){pr(g,12,22,1,4,t==='pink'?'#f0a0a0':fur);pr(g,13,25,2,1,t==='pink'?'#f0a0a0':fur)}
      else if(t==='curl'){pr(g,12,21,1,4,fur);pr(g,13,25,2,1,fur);pr(g,15,23,1,2,fur)}
      else if(t==='puff'||t==='short'){pe(g,12,23,2,1,t==='puff'?'#fff':fur)}
      else if(t==='fin'){pr(g,11,21,3,6,shd(fur,.2))}
      else if(t==='drag'){pr(g,11,21,3,5,fur);pr(g,12,26,2,2,fur);pr(g,12,20,1,1,'#f0d040');pr(g,12,23,1,1,'#f0d040')}
      return;
    }
    const sx=side?16:16;
    if(t==='huge'){pe(g,sx+2,15,4,8,fur);pe(g,sx+3,12,3,4,furL)}
    else if(t==='bushy'){pe(g,sx+2,20,3,4,fur);if(A.tip)pe(g,sx+3,17,2,2,A.tip)}
    else if(t==='ring'){pe(g,sx+2,19,3,5,fur);pr(g,sx,17,5,1,furD);pr(g,sx,20,5,1,furD);pr(g,sx,23,5,1,furD)}
    else if(t==='stripe'){pe(g,sx+2,17,3,6,'#2a2a32');pr(g,sx+2,12,1,10,'#f4f4f4')}
    else if(t==='thin'||t==='pink'){const c=t==='pink'?'#f0a0a0':fur;pr(g,sx,22,3,1,c);pr(g,sx+3,19,1,3,c)}
    else if(t==='curl'){pr(g,sx,22,3,1,fur);pr(g,sx+3,18,1,4,fur);pr(g,sx+1,17,2,1,fur)}
    else if(t==='drag'){pr(g,sx,21,4,2,fur);pr(g,sx+4,19,2,2,fur);pr(g,sx+6,17,1,2,fur);pr(g,sx+2,20,1,1,'#f0d040')}
    else if(t==='fin'&&side){pr(g,sx,19,5,3,shd(fur,.2))}
    else if(t==='puff'&&side){pe(g,sx+1,22,1,1,'#fff')}
  };
  const capeBack=()=>{if(top==='Capa'){if(up){pr(g,6,14,12,13,cl);pr(g,7,14,10,1,clL);pr(g,6,26,12,1,clD)}else if(side){pr(g,14,15,4,11,cl)}else{pr(g,5,15,2,11,clD);pr(g,17,15,2,11,clD)}}};
  if(!up){drawTail();capeBack()}
  // ---------- ears behind head
  const ears=(front)=>{
    const e=A.ear,inn='#f4a0b0',ex1=side?hx+1:7,ex2=side?hx+1:16;
    if(e==='mane'&&!front){pe(g,hx,hy+1,8,7,shd(fur,-.35));pe(g,hx,hy+1,7,6,shd(fur,-.2));return}
    if(front)return;
    const both=(fn)=>{if(side)fn(hx+2,1);else{fn(7,0);fn(16,1)}};
    if(e==='point'||e==='tuft'){both((x,r)=>{pr(g,x-1,3,3,2,fur);pr(g,x-1+r,1,2,2,fur);pr(g,x,2,1,2,inn);if(e==='tuft')pr(g,x+r-1,0,1,1,furD)})}

    else if(e==='flop'){if(side){pr(g,hx+2,5,3,7,furD)}else{pr(g,4,5,3,7,furD);pr(g,17,5,3,7,furD)}}
    else if(e==='tufto'){both(x=>{pr(g,x-1,3,3,2,fur);pr(g,x,2,1,1,furD)})}
    else if(e==='gill'){const c='#e0508a';const fr2=(x,dirn)=>{for(let i=0;i<3;i++){pr(g,x+dirn*i,5+i*2,3,1,c)}};if(side)fr2(hx+5,1);else{fr2(3,0);fr2(18,0)}}
    else if(e==='horn'){both(x=>{pr(g,x-1,1,2,3,'#b8b0a0');pr(g,x+(x<12?-2:1),0,2,2,'#b8b0a0')})}
    else if(e==='bull'){const c='#f0ead8';if(side){pr(g,hx-4,3,5,2,c);pr(g,hx-5,1,2,2,c)}else{pr(g,2,4,5,2,c);pr(g,1,2,2,2,c);pr(g,17,4,5,2,c);pr(g,21,2,2,2,c)}}
    else if(e==='crest'){for(let i=-1;i<=1;i++){pr(g,hx+i*2,0,1,4,fur);pr(g,hx+i*2-1,-1+1,2,2,'#40c0a0')}}
    else if(e==='antler'){const c='#8a6a40';both(x=>{const s=x<12?-1:1;pr(g,x,0,1,4,c);pr(g,x+s,1,1,1,c);pr(g,x+s*2,0,1,2,c);pr(g,x-s,2,1,1,c)})}
    else if(e==='drag'){both(x=>{pr(g,x,1,2,3,'#f0d040')})}
    else if(e==='side'){if(side)pe(g,hx+3,hy,2,2,bel);else{pe(g,5,hy,2,2,bel);pe(g,18,hy,2,2,bel)}}
  };
  ears(false);
  // ---------- legs
  const legC=pants,shoe='#3a2a2a';
  if(A.legs==='bird'){
    const lc='#f08040';
    if(side){pr(g,11,23,1,6-(step>0?1:0),lc);pr(g,13,23,1,6-(step<0?1:0),lc);pr(g,9,28-(step>0?1:0),3,1,lc);pr(g,12,28-(step<0?1:0),3,1,lc)}
    else{pr(g,9,23,1,6-(step>0?1:0),lc);pr(g,14,23,1,6-(step<0?1:0),lc);pr(g,8,28-(step>0?1:0),3,1,lc);pr(g,13,28-(step<0?1:0),3,1,lc)}
  }else if(A.legs==='tent'){
    const c=fur;for(let i=0;i<4;i++){const x=(side?8:7)+i*3,w=Math.sin((FR*0+fr+i)*1.6)>0?1:0;pr(g,x,23,2,4,c);pr(g,x+w,27,2,2,c);pr(g,x,24,1,1,shd(c,.3))}
  }else if(side){
    const a=step*2;
    pr(g,10+a,23,3,5,legC);pr(g,10+a,27,4,2,shoe);
    pr(g,12-a,23,3,5,shd(legC,-.2));pr(g,12-a,27,4,2,shoe);
  }else{
    pr(g,8,23,3,5-(step>0?1:0),legC);pr(g,8,27-(step>0?1:0),3,2,shoe);
    pr(g,13,23,3,5-(step<0?1:0),legC);pr(g,13,27-(step<0?1:0),3,2,shoe);
  }
  // ---------- torso
  const tx=side?8:7,tw=side?8:10,ty=15,th=9;
  const torso=()=>{
    if(top==='Armadura'){pr(g,tx,ty,tw,th,'#a8acb8');pr(g,tx,ty,tw,1,'#d8dce8');pr(g,tx,ty+5,tw,2,cl);pr(g,tx+tw-1,ty,1,th,'#787c88');if(down){pr(g,11,ty+1,2,4,'#d8dce8')}return}
    if(top==='Bata'){pr(g,tx,ty,tw,th+2,'#f0f0f0');pr(g,tx+tw-1,ty,1,th+2,'#c8c8d0');if(down){pr(g,11,ty,2,th,cl)}return}
    if(top==='Overol'){pr(g,tx,ty,tw,th,'#f0f0f0');if(!up){pr(g,tx+2,ty+2,tw-4,th-2,cl);pr(g,tx+2,ty,1,2,cl);pr(g,tx+tw-3,ty,1,2,cl)}else pr(g,tx,ty+3,tw,th-3,cl);return}
    pr(g,tx,ty,tw,th,cl);pr(g,tx,ty,1,th,clL);pr(g,tx+tw-1,ty,1,th,clD);

    if(top==='Sudadera'){if(down)pr(g,tx+2,ty+5,tw-4,2,clD);pr(g,tx+1,ty-1,tw-2,2,clD);if(up){pe(g,12,ty+1,4,2,clD)}}
    if(top==='Chaqueta'&&down){pr(g,11,ty,2,th,'#f0f0f0');pr(g,10,ty,1,th,clD)}
    if(top==='Vestido'){if(side)pr(g,tx-1,ty+5,tw+2,5,cl);else{pr(g,tx-1,ty+5,tw+2,5,cl);pr(g,tx-1,ty+9,tw+2,1,clD)}}
    if(top==='Túnica'){pr(g,tx,ty+th-1,tw,4,cl);pr(g,tx,ty+5,tw,1,'#c8a040')}
    if(top==='Capa'){pr(g,tx,ty,tw,2,clD);if(down){pr(g,11,ty+2,2,1,'#f0d040')}}
    if(down&&(A.id==='pinguino'))pr(g,tx+3,ty+1,tw-6,th-2,shd(bel,-.05));

  torso();
  // ---------- arms
  const sleeve=top==='Armadura'?'#a8acb8':top==='Bata'?'#f0f0f0':top==='Overol'?'#f0f0f0':cl;

  pr(g,hx-hrx+2,hy+hry,hrx*2-3,1,furD);

  const eye='#141018';

    const f=A.face;

    else if(f==='octo'){pr(g,8,9,2,3,'#fff');pr(g,14,9,2,3,'#fff');pr(g,9,10,1,2,eye);pr(g,14,10,1,2,eye);pr(g,10,6,1,1,furL);pr(g,14,5,1,1,furL)}
    else{

    if(f==='cat'){pr(g,11,11,2,1,'#e07090');pr(g,4,11,3,1,'#c0c0c0');pr(g,17,11,3,1,'#c0c0c0')}
    if(f==='panda'){pr(g,11,11,2,1,'#222')}
    if(f==='owl'){pr(g,11,10,2,2,'#e0a030')}

    if(f==='monkey'){pr(g,11,12,2,1,'#5a2a1a')}

  }else if(side){

  }
  if(up){ears(false)}
  // ---------- hats
  const sc=ac,scD=acD;
  const hatDraw=()=>{
    const H=HATS[hat];const o=side?-1:0;
    if(H==='Gorra'){pe(g,hx,4,5,2,sc);pr(g,hx-5,4,11,2,sc);if(down)pr(g,hx-5,6,11,1,scD);else if(side)pr(g,hx-8,5,5,1,scD);pr(g,hx-1,2,2,1,shd(sc,.3))}

// draw a character in game px with feet at (x,y)
function drawCharAt(look,x,y,dir,fr,alpha){
  const sh=charSheet(look);
  if(alpha!=null)X.globalAlpha=alpha;
  X.drawImage(sh,CW*(fr&3),CH*dir,CW,CH,Math.round(x-CW/2),Math.round(y-CH+1),CW,CH);

}

function pick2(r,a){return a[Math.floor(r()*a.length)]}
// ---------------- objects
function objRect(o){
  switch(o.k){
    case'npc':case'pet':return[o.px-6,o.py-5,12,7];
    case'house':return[o.x*16,o.y*16,o.w*16,o.h*16];
    case'gate':case'vines':return[o.x*16,o.y*16,16,(o.h||1)*16];
    case'tower':return[o.x*16,o.y*16,48,30];
    case'panel':return[o.x*16,o.y*16,32,16];
    case'pit':return[o.x*16+2,o.y*16+2,28,12];
    case'boss':return[o.px-14,o.py-14,28,16];
    case'sofa':return[o.x*16,o.y*16,32,16];
    case'bed':return[o.x*16,o.y*16,16,28];
    case'deco':return[o.x*16,o.y*16,(o.w||1)*16,16];
    case'rock':return[o.rx*16+1,o.ry*16+1,14,14];
    case'door':return[o.x*16-8,o.y*16,32,18];
    default:return[o.x*16,o.y*16,16,16];
  }
}
function isSolidObj(o){
  if(o.gone)return false;
  if(o.k==='plate'||o.k==='pit'||o.k==='door'||o.k==='lift')return false;
  if(o.k==='gate'||o.k==='vines')return !cond(o.cond);
  if(o.k==='deco')return o.s==='djbooth'||o.s==='shelf'||o.s==='stove';
  if(o.k==='sign'&&o.s==='stove')return true;
  return true;
}
function cond(c){
  if(!c)return true;
  if(c.startsWith('plates:')){const g=c.slice(7);return OBJS.filter(o=>o.k==='plate'&&o.g===g).every(o=>S.fl['pl:'+o.pid])}
  if(c.startsWith('b:'))return !!S.fl[c];
  if(c==='crowns2')return !!(S.fl['b:grok']&&S.fl['b:gpt']);
  if(c==='crowns3')return crowns()>=3;
  if(c==='term')return !!S.fl.t1;
  return !!S.fl[c];
}
function enterRoom(id,tx,ty,d){
  ROOM=ROOMS[id];S.room=id;renderRoomLayer();
  PL.x=tx*16+8;PL.y=ty*16+8;if(d!=null)PL.d=d;PL.mv=0;
  OBJS=ROOM.obj.map((o,i)=>{const n=Object.assign({},o);n.px=o.x*16+8;n.py=o.y*16+14;n.i=i;
    if(n.k==='plate')n.pid=id+'_'+i;
    if(n.k==='rock'){const p=S.fl['rock_'+o.id]||[o.x,o.y];n.rx=p[0];n.ry=p[1]}
    if(n.k==='boss'&&(S.fl['b:'+o.id]||(o.once&&S.fl['b:'+o.once])))n.gone=1;
    if(n.k==='chest'&&S.fl['ch:'+o.id])n.open=1;
    if(n.k==='npc'){n.hx=n.px;n.hy=n.py;n.d=0;n.wt=rint(30,120);n.def=NPCDEF[o.id];if(o.cond&&!cond(o.cond))n.gone=1}
    if(n.k==='pet'){n.d=0;n.def=NPCDEF[o.id]}
    if(n.k==='gate'||n.k==='vines')n.op=cond(n.cond)?1:0;
    if(n.k==='tower'&&n.hide&&!cond(n.cond)&&!S.fl['b:'+n.ai])n.gone=1;
    return n});
  WT.enc=rnd(420,780)/(ROOM.rate||1);
  AU.play(ROOM.mus);
  S.x=tx;S.y=ty;
  WT.title=150;
  if(typeof netRoomChanged==='function')netRoomChanged();
}
function solidAt(px,py,ignore){
  const tx=Math.floor(px/16),ty=Math.floor(py/16);
  if(SOLID.has(tileAt(tx,ty)))return true;
  for(const o of OBJS){if(o===ignore||!isSolidObj(o))continue;const[r0,r1,r2,r3]=objRect(o);if(px>=r0&&px<r0+r2&&py>=r1&&py<r1+r3)return true}
  return false;
}
function boxFree(x,y,ign){return!(solidAt(x-5,y-3,ign)||solidAt(x+4,y-3,ign)||solidAt(x-5,y+2,ign)||solidAt(x+4,y+2,ign))}
const DIRV=[[0,1],[0,-1],[-1,0],[1,0]];
function worldUpdate(){
  if(WT.title>0)WT.title--;
  // npcs
  for(const o of OBJS){
    if(o.k==='npc'&&!o.gone&&!o.still){
      if(o.talk){o.talk--;continue}
      if(o.mv){const v=DIRV[o.d];const nx=o.px+v[0]*.6,ny=o.py+v[1]*.6;
        if(Math.abs(nx-o.hx)<28&&Math.abs(ny-o.hy)<20&&boxFree(nx,ny,o)&&Math.hypot(nx-PL.x,ny-PL.y)>14){o.px=nx;o.py=ny;o.an+= .1}else o.mv=0;
        if(--o.mvt<=0)o.mv=0}
      else if(--o.wt<=0){o.wt=rint(60,200);if(RNG()<.7){o.mv=1;o.mvt=rint(20,60);o.d=rint(0,3)}}
    }
    if(o.k==='pet'){const t=OBJS.find(q=>q.id===o.follow);if(t){const tx=t.px+12,ty=t.py+4;const dx=tx-o.px,dy=ty-o.py,dd=Math.hypot(dx,dy);
      if(dd>6){o.px+=dx/dd*.9;o.py+=dy/dd*.9;o.an=(o.an||0)+.15;o.d=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0)}else o.an=0;
      if(RNG()<.004)o.hop=12}if(o.hop)o.hop--}
    if((o.k==='gate'||o.k==='vines')&&cond(o.cond)&&o.op<1){if(o.op===0)AU.sfx('door');o.op=Math.min(1,o.op+.03)}
  }
  if(UI.busy())return;
  // movement
  let dx=0,dy=0;
  if(K.left)dx--;if(K.right)dx++;if(K.up)dy--;if(K.down)dy++;
  const run=K.x?1.6:1;const sp=1.25*run;
  if(dx||dy){
    if(dy>0)PL.d=0;else if(dy<0)PL.d=1;if(dx<0&&!dy)PL.d=2;else if(dx>0&&!dy)PL.d=3;
    if(dx&&dy){/* keep vertical facing unless pure horizontal */ if(PL.d!==0&&PL.d!==1)PL.d=dy>0?0:1}
    const l=Math.hypot(dx,dy);let mx=dx/l*sp,my=dy/l*sp,moved=0;
    if(boxFree(PL.x+mx,PL.y,null)){PL.x+=mx;moved+=Math.abs(mx)}
    if(boxFree(PL.x,PL.y+my,null)){PL.y+=my;moved+=Math.abs(my)}
    PL.mv=moved>0?1:0;PL.an+=moved*.09;
    if(moved){
      if(ROOM.enc&&!NET.inBattle()){WT.enc-=moved;if(WT.enc<=0){WT.enc=rnd(420,780)/(ROOM.rate||1);startEncounter(pick(ENC[ROOM.enc]));return}}
      stepTriggers();
    }
  }else{PL.mv=0;PL.an=0}
  PL.fr=PL.mv?(Math.floor(PL.an)%4):0;
  // exits
  const tx=Math.floor(PL.x/16),ty=Math.floor(PL.y/16);
  for(const e of ROOM.ex){if(tx>=e.r[0]&&tx<e.r[0]+e.r[2]&&ty>=e.r[1]&&ty<e.r[1]+e.r[3]){transition(e.to,e.at[0],e.at[1],e.d);return}}
  if(P_('z'))interact();
  else if(P_('c'))openPause();
  else if(P_('t'))openChat();
}
function stepTriggers(){
  for(const o of OBJS){
    if(o.k==='plate'&&o.g!=='w2'){const[r0,r1,r2,r3]=objRect(o);if(PL.x>=r0&&PL.x<r0+r2&&PL.y>=r1&&PL.y<r1+r3&&!S.fl['pl:'+o.pid]){S.fl['pl:'+o.pid]=1;AU.sfx('ok')}}
    if(o.k==='pit'){const[r0,r1,r2,r3]=objRect(o);if(PL.x>=r0&&PL.x<r0+r2&&PL.y>=r1&&PL.y<r1+r3){AU.sfx('dust');UI.flash('#000');transition(o.to,o.at[0],o.at[1],0,'Caes por el glitch...');return}}
  }
}
function transition(to,tx,ty,d,msg){
  UI.fade(()=>{enterRoom(to,tx,ty,d);if(msg)say([msg])});
}
function facingPoint(){const v=DIRV[PL.d];return[PL.x+v[0]*13,PL.y+v[1]*13-2]}
function objAtPoint(px,py){
  for(const o of OBJS){if(o.gone)continue;let[r0,r1,r2,r3]=objRect(o);
    if(o.k==='npc'||o.k==='pet'){r0-=3;r1-=10;r2+=6;r3+=12}
    if(o.k==='tower'||o.k==='panel'){r3+=10}
    if(o.k==='house'){continue}
    if(px>=r0&&px<r0+r2&&py>=r1&&py<r1+r3)return o}
  return null;
}
async function interact(){
  const[fx,fy]=facingPoint();
  // another player?
  const pp=NET.playerNear(fx,fy);
  if(pp){await playerMenu(pp);return}
  let o=objAtPoint(fx,fy);
  if(!o){ // houses doors: check door objs in front
    return;
  }
  AU.sfx('sel');
  switch(o.k){
    case'npc':{
      o.d=[1,0,3,2][PL.d];o.talk=120;
      const df=o.def;await say(df.lines(),{who:df.n,look:df.lk});
      if(o.shop)await openShop(o.shop);
      if(df.ward){const c=await choose('¿Quieres que Pavlo cambie tu estilo?',['Sí','No']);if(c===0)await openCreator(true)}
      break}
    case'pet':o.hop=14;await say(['Avellana te mira, salta dos veces y vuelve corriendo con Nuez.']);break;
    case'sign':case'memory':await say(o.t);if(o.k==='memory'&&!S.fl['m:'+o.id]){S.fl['m:'+o.id]=1}break;
    case'star':await useStar(o);break;
    case'sofa':await say(['Te hundes en el sofá. La música te envuelve.']);await useStar(Object.assign({},o,{id:'sofa_'+ROOM.id}));break;
    case'bed':{const c=await choose('Tu cama. ¿Mirarte al espejo de al lado?',['Cambiar estilo','Nada']);if(c===0)await openCreator(true);break}
    case'chest':if(o.open){await say(['El cofre está vacío.']);break}
      o.open=1;S.fl['ch:'+o.id]=1;giveThing(o.give);AU.sfx('save');await say([o.t]);if(o.id==='skate')S.fl.skate=1;saveGame();break;
    case'boss':await bossEncounter(o);break;
    case'door':await useDoor(o);break;
    case'gate':case'vines':if(!cond(o.cond))await say([o.k==='vines'?'Unas enredaderas de código cierran el paso. Se mueven al ritmo de algo... grande.':'Una carpeta cerrada bloquea el paso.']);break;
    case'term':await useTerminal(o);break;
    case'rock':{const c=await choose('Una caja pesadísima. ¿Devolverla a su lugar?',['Sí','No']);if(c===0){const src=ROOM.obj[o.i];o.rx=src.x;o.ry=src.y;delete S.fl['rock_'+o.id]}break}
    case'panel':if(cond(o.cond)){await say(['El panel reconoce la llave del Compilador. Se abre un pasillo caliente...']);transition(o.to,o.at[0],o.at[1],1)}else await say(['Un panel metálico con una cerradura de forma rara. Parece hecha para una llave... compilada.']);break;
    case'tower':await useTower(o);break;
    case'lift':{const c=await choose('Un ascensor oxidado. ¿Subir al Código puro?',['Subir','Quedarse']);if(c===0)transition(o.to,o.at[0],o.at[1],0);break}
    case'deco':if(o.s==='djbooth')await say(['La cabina de Flavia. Hay cables por todas partes.']);break;
  }
}
// push rocks when walking into them
function tryPush(){
  if(!(K.left||K.right||K.up||K.down))return;
  const[fx,fy]=facingPoint();
  for(const o of OBJS){if(o.k!=='rock')continue;const[r0,r1,r2,r3]=objRect(o);
    if(fx>=r0&&fx<r0+r2&&fy>=r1&&fy<r1+r3){o.push=(o.push||0)+1;if(o.push>14){o.push=0;const v=DIRV[PL.d];const nx=o.rx+v[0],ny=o.ry+v[1];
      if(!SOLID.has(tileAt(nx,ny))&&!OBJS.some(q=>q!==o&&isSolidObj(q)&&q.k!=='rock'&&rectHit(objRect(q),nx*16+8,ny*16+8))){o.rx=nx;o.ry=ny;AU.sfx('step');S.fl['rock_'+o.id]=[nx,ny];
        for(const p of OBJS)if(p.k==='plate'&&p.g==='w2'&&p.x===nx&&p.y===ny&&!S.fl['pl:'+p.pid]){S.fl['pl:'+p.pid]=1;AU.sfx('ok')}}}}
    else o.push=0}
}
function rectHit(r,x,y){return x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3]}
function giveThing(g){const[t,id]=g;if(t==='i'){if(S.items.length<12)S.items.push(id)}else if(t==='w'){if(!S.weap.includes(id))S.weap.push(id)}else if(t==='a'){if(!S.arm.includes(id))S.arm.push(id)}else if(t==='c'){if(!S.chips.includes(id))S.chips.push(id)}}

// ---------------- dialog
function say(lines,opt){
  opt=opt||{};lines=Array.isArray(lines)?lines:[lines];
  return new Promise(res=>{
    const p={i:0,c:0,res,lines,opt,
      update(){
        const L=this.lines[this.i]||'';
        if(this.c<L.length){const sp=K.x?3:1;for(let k=0;k<sp&&this.c<L.length;k++){this.c++;const ch=L[this.c-1];if(ch!==' '&&this.c%2)AU.sfx('blip')}if(P_('z')||P_('x'))this.c=L.length}
        else if(P_('z')){this.i++;this.c=0;if(this.i>=this.lines.length){UI.pop(this);res()}}
      },
      draw(){
        const top=(GS==='world'&&PL.y-CAMY_last>150);
        const y=top?6:GH-76,x=10,w=GW-20,h=70;boxW(x,y,w,h);
        let tx=x+10;
        if(this.opt.look){R(x+6,y+8,44,54,'#111');drawCharBig(this.opt.look,x+28,y+60,0,0,2);tx=x+56}
        if(this.opt.who){T(this.opt.who,tx,y+4,'#ffe040',20)}
        const L=(this.lines[this.i]||'').slice(0,this.c);
        const ww=wrap(L,w-(tx-x)-10,24);ww.slice(0,4).forEach((l,j)=>T((j===0?'* ':'  ')+l,tx,y+(this.opt.who?14:8)+j*13,'#fff',24));
        if(this.c>=(this.lines[this.i]||'').length&&FR%40<20)R(x+w-10,y+h-8,4,3,'#fff');
      }};
    UI.push(p);
  });
}
let CAMY_last=0;
// ---------------- choice
function choose(q,opts,vertical){
  return new Promise(res=>{
    const vert=vertical||opts.length>3||opts.some(o=>o.length>12);
    const p={sel:0,c:0,q,opts,
      update(){
        if(this.c<this.q.length){this.c+=2;if(P_('z')||P_('x'))this.c=this.q.length;return}
        const n=this.opts.length;
        if(vert){if(P_('up')){this.sel=(this.sel+n-1)%n;AU.sfx('blip')}if(P_('down')){this.sel=(this.sel+1)%n;AU.sfx('blip')}}
        else{if(P_('left')){this.sel=(this.sel+n-1)%n;AU.sfx('blip')}if(P_('right')){this.sel=(this.sel+1)%n;AU.sfx('blip')}}
        if(P_('z')){AU.sfx('ok');UI.pop(this);res(this.sel)}
        else if(P_('x')){UI.pop(this);res(-1)}
      },
      draw(){
        const lines=wrap(this.q.slice(0,this.c),GW-40,24);
        const nOpt=vert?Math.min(this.opts.length,8):1;
        const h=Math.max(70,lines.length*13+16+(vert?nOpt*12:14));
        const y=GH-h-6;boxW(10,y,GW-20,h);
        lines.forEach((l,j)=>T((j===0?'* ':'  ')+l,20,y+8+j*13,'#fff',24));
        if(this.c<this.q.length)return;
        const oy=y+12+lines.length*13;
        if(vert){const off=Math.max(0,Math.min(this.sel-nOpt+1,this.opts.length-nOpt));
          for(let i=0;i<nOpt;i++){const k=i+off;T(this.opts[k],44,oy+i*12,k===this.sel?'#ffe040':'#fff',24);if(k===this.sel)heart(34,oy+i*12+4)}}
        else{const sp=(GW-40)/this.opts.length;this.opts.forEach((o,i)=>{const ox=30+i*sp;T(o,ox+12,oy,i===this.sel?'#ffe040':'#fff',24);if(i===this.sel)heart(ox,oy+4)})}
      }};
    UI.push(p);
  });
}

// ---------------- generic list
function pickList(title,items,o){
  o=o||{};
  return new Promise(res=>{
    const p={sel:o.sel||0,title,items,
      update(){
        const n=this.items.length;if(!n){if(P_('x')||P_('z')){UI.pop(this);res(-1)}return}
        if(P_('up')){this.sel=(this.sel+n-1)%n;AU.sfx('blip')}
        if(P_('down')){this.sel=(this.sel+1)%n;AU.sfx('blip')}
        if(o.lr&&(P_('left')||P_('right'))){const r=o.lr(this.sel,P_('left')?-1:1);if(r!==undefined){UI.pop(this);res(r)}}
        if(P_('z')){const it=this.items[this.sel];if(it&&it.dis){AU.sfx('no');return}AU.sfx('ok');if(!o.keep)UI.pop(this);res(this.sel)}
        else if(P_('x')||(o.cKey&&P_('c'))){UI.pop(this);res(-1)}
      },
      draw(){
        const x=o.x!=null?o.x:10,y=o.y!=null?o.y:10,w=o.w||150,rows=o.rows||Math.min(12,Math.max(1,this.items.length));
        const h=o.h||(rows*12+(this.title?20:10)+4);
        boxW(x,y,w,h);let yy=y+6;if(this.title){T(this.title,x+10,y+4,'#ffe040',22);yy+=14}
        const off=Math.max(0,Math.min(this.sel-rows+1,this.items.length-rows));
        for(let i=0;i<rows&&i+off<this.items.length;i++){const k=i+off,it=this.items[k];const lab=typeof it==='string'?it:it.l;
          T(lab,x+20,yy+i*12,it&&it.dis?'#777':k===this.sel?'#ffe040':(it&&it.c)||'#fff',22);
          if(it&&it.r)T(it.r,x+w-8,yy+i*12,it.rc||'#aaa',20,'right');
          if(k===this.sel)heart(x+8,yy+i*12+4)}
        if(off>0)T('▲',x+w/2,y+1,'#888',14);if(off+rows<this.items.length)T('▼',x+w/2,y+h-9,'#888',14);
        if(o.side)o.side(this.sel);
        if(o.desc){const d=o.desc(this.sel);if(d){const dl=wrap(d,GW-20-16,20);const dh=dl.length*10+8;boxW(10,GH-dh-6,GW-20,dh);dl.forEach((l,i)=>T(l,18,GH-dh-2+i*10,'#ccc',20))}}
      }};
    UI.push(p);
  });
}
// ---------------- stats
function curLoadout(mode){return S.lo[mode||(GS==='duel'?'du':'av')]}
function stats(mode){
  const R_=ROLES[S.role],lv=S.lv,lo=curLoadout(mode);
  const W=WEAPONS[lo.w]||WEAPONS.rama,A=ARMORS[lo.a]||ARMORS.sueter,ch=lo.c||[];
  let mhp=Math.round(R_.hp[0]+R_.hp[1]*(lv-1))+(S.fl.hpb||0);
  let atk=Math.round(R_.atk[0]+R_.atk[1]*(lv-1))+(W.atk||0)+(A.atk||0);
  let def=Math.round(R_.def[0]+R_.def[1]*(lv-1))+(A.def||0);
  let mag=Math.round(R_.mag[0]+R_.mag[1]*(lv-1))+(W.mag||0)+(A.mag||0);
  if(ch.includes('vida'))mhp=Math.round(mhp*1.25);
  if(ch.includes('fuerza'))atk+=4;
  return{mhp,atk,def,mag,W,A,ch,gr:(A.gr||0)+(ch.includes('iman')?.6:0),ram:ramMax()};
}
function ramMax(){return 3+Math.floor(S.lv/3)}
function ramUsed(lo){return(lo.c||[]).reduce((a,c)=>a+(CHIPS[c]?CHIPS[c].ram:0),0)}
function skillsFor(){const r=ROLES[S.role];const out=r.sk.filter(k=>SKILLS[k].lv<=S.lv);if(S.sub)for(const k of SUBS[S.sub].sk)if(SKILLS[k].lv<=S.lv)out.push(k);return out}
function gainXP(x){
  if(S.lv>=LV_MAX)return false;S.xp+=x;let up=false;
  while(S.lv<LV_MAX&&S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;up=true}
  if(S.lv>=LV_MAX)S.xp=0;return up;
}
async function chooseSub(){
  const r=ROLES[S.role];const subs=r.subs;
  await say(['¡Nivel 15! Tu '+r.n.toUpperCase()+' puede especializarse.','Elige una SUBCLASE. (Es permanente para este personaje.)']);
  const i=await pickList('SUBCLASE',subs.map(s=>SUBS[s].n),{x:10,y:10,w:120,desc:k=>{const s=SUBS[subs[k]];return s.desc+' '+s.pas+' Habilidades: '+s.sk.map(q=>SKILLS[q].n+' (Nv '+SKILLS[q].lv+')').join(', ')}});
  if(i<0)return chooseSub();
  S.sub=subs[i];AU.sfx('lvl');await say(['¡Ahora eres '+SUBS[S.sub].n.toUpperCase()+'!']);saveGame();
}

// ---------------- shop
async function openShop(id){
  const sh=SHOPS[id];
  while(true){
    const c=await choose(sh.greet+' (Tienes '+S.g+' bellotas)',['Comprar','Vender','Salir']);
    if(c===0){
      while(true){
        const list=sh.items.map(([t,k])=>{const d=t==='i'?ITEMS[k]:t==='w'?WEAPONS[k]:t==='a'?ARMORS[k]:CHIPS[k];const owned=t==='w'?S.weap.includes(k):t==='a'?S.arm.includes(k):t==='c'?S.chips.includes(k):false;
          return{l:d.n,r:owned?'TIENES':d.p+'B',rc:owned?'#888':S.g>=d.p?'#fff':'#f66',t,k,d,owned}});
        const j=await pickList('COMPRAR  ('+S.g+'B)',list,{x:10,y:10,w:230,rows:Math.min(10,list.length),desc:k=>{const q=list[k];const tag={i:'Objeto',w:'Arma',a:'Armadura',c:'Chip ('+(q.d.ram||0)+' RAM)'}[q.t];return tag+': '+q.d.d+(q.t==='w'?' ATQ+'+q.d.atk+(q.d.mag?' MAG+'+q.d.mag:''):q.t==='a'?' DEF+'+q.d.def:'')}});
        if(j<0)break;const q=list[j];
        if(q.owned){AU.sfx('no');UI.toast('Ya lo tienes','#aaa');continue}
        if(S.g<q.d.p){AU.sfx('no');UI.toast('No te alcanza','#f66');continue}
        if(q.t==='i'&&S.items.length>=12){AU.sfx('no');UI.toast('Inventario lleno','#f66');continue}
        S.g-=q.d.p;giveThing([q.t,q.k]);AU.sfx('save');UI.toast('Compraste '+q.d.n);saveGame();
      }
    }else if(c===1){
      while(true){
        if(!S.items.length){await say(['No tienes nada que vender.']);break}
        const j=await pickList('VENDER',S.items.map(k=>({l:ITEMS[k].n,r:Math.floor(ITEMS[k].p/2)+'B'})),{x:10,y:10,w:200});
        if(j<0)break;const k=S.items[j];S.g+=Math.floor(ITEMS[k].p/2);S.items.splice(j,1);AU.sfx('ok');saveGame();
      }
    }else return;
  }
}

function soulR(role,ch){let r=role==='asesino'?2.6:3.4;if(ch&&ch.includes('ojo'))r*=.85;return r}
function soulUpdate(ctx){
  const role=ctx.role,ch=ctx.ch||[];
  let sp=1.6*(ch.includes('turbo')?1.2:1);
  if(role==='tanque'&&K.z)sp*=.6;
  let dx=0,dy=0;if(K.left)dx--;if(K.right)dx++;if(K.up)dy--;if(K.down)dy++;
  if(dx||dy){if(Math.abs(dx)>=Math.abs(dy))SOUL.face=dx<0?2:3;else SOUL.face=dy<0?1:0}
  if(SOUL.cd>0)SOUL.cd--;if(SOUL.inv>0)SOUL.inv--;if(SOUL.pulse>0)SOUL.pulse--;if(SOUL.blink>0)SOUL.blink--;
  const ox=SOUL.x,oy=SOUL.y;
  // abilities
  if(role==='guerrero'&&P_('x')&&SOUL.cd<=0&&(dx||dy)){SOUL.dash=10;SOUL.dvx=dx;SOUL.dvy=dy;SOUL.cd=45;SOUL.inv=Math.max(SOUL.inv,12);AU.sfx('shot')}
  if(role==='asesino'&&P_('x')&&SOUL.cd<=0&&(dx||dy)){const l=Math.hypot(dx,dy);SOUL.x+=dx/l*26;SOUL.y+=dy/l*26;SOUL.cd=60;SOUL.inv=Math.max(SOUL.inv,10);SOUL.blink=8;AU.sfx('shot')}
  if(role==='apoyo'&&P_('z')&&SOUL.pulse<=0){SOUL.pulse=150;ctx.heal&&ctx.heal(2+Math.floor(S.lv/3));ctx.tp&&ctx.tp(4);AU.sfx('heal')}
  if(role==='invocador'&&K.z&&SOUL.cd<=0){SOUL.cd=10;SOUL.shots.push({x:SOUL.x,y:SOUL.y-4});if(S.sub==='titiritero'){SOUL.shots.push({x:SOUL.x-4,y:SOUL.y-2,vx:-.6},{x:SOUL.x+4,y:SOUL.y-2,vx:.6})}AU.sfx('shot')}
  SOUL.slowing=0;
  if(role==='mago'){if(K.z&&SOUL.focus>0){SOUL.slowing=1;SOUL.focus-=1.2}else SOUL.focus=Math.min(100,SOUL.focus+(S.sub==='cronomante'?.8:.4))}
  SOUL.shield=role==='tanque'&&K.z?1:0;
  // movement
  if(SOUL.grav){
    if(dx)SOUL.x+=dx*sp;
    SOUL.gvy+=.22;if(SOUL.ground&&(P_('up')||P_('z')&&role!=='tanque'&&role!=='mago'&&role!=='invocador'&&role!=='apoyo')){SOUL.gvy=-4.2;SOUL.ground=false}
    if(!K.up&&SOUL.gvy<-1.5)SOUL.gvy+=.25;
    SOUL.y+=SOUL.gvy;
  }else if(SOUL.dash>0){SOUL.dash--;const l=Math.hypot(SOUL.dvx,SOUL.dvy)||1;SOUL.x+=SOUL.dvx/l*4.2;SOUL.y+=SOUL.dvy/l*4.2}
  else if(dx||dy){const l=Math.hypot(dx,dy);SOUL.x+=dx/l*sp;SOUL.y+=dy/l*sp}
  const r=4;
  SOUL.x=clamp(SOUL.x,BX.x+r,BX.x+BX.w-r);
  const by=BX.y+BX.h-r;SOUL.ground=false;
  if(SOUL.y>by){SOUL.y=by;if(SOUL.grav){SOUL.gvy=0;SOUL.ground=true}}
  if(SOUL.y<BX.y+r){SOUL.y=BX.y+r;if(SOUL.gvy<0)SOUL.gvy=0}
  SOUL.moved=Math.abs(SOUL.x-ox)+Math.abs(SOUL.y-oy)>.3;
  // shots
  for(const s of SOUL.shots){s.y-=4;s.x+=s.vx||0}
  SOUL.shots=SOUL.shots.filter(s=>s.y>BX.y-4);
}

}

    if(b.dead)continue;

function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}

function hostEndTurn(){
  const P=BT.P,H=BT.H;
  // gather thorn values + tp
  let anyAlive=false;
  for(const pid of P.mem){
    let d=null,hp=null;
    if(pid===NET.myPid()){d=BT.L.myDone;hp=S.hp}else{const pr=NET.partyPresence(pid);if(!pr)continue;d=pr.bd&&pr.bd.id===P.id&&pr.bd.t===P.turn?pr.bd:null;hp=pr.hp}
    if(d){P.tp=Math.min(100,P.tp+(d.g||0));if(d.th)H.th[pid]=(H.th[pid]||0)+d.th}
    if(hp>0)anyAlive=true;
  }
  if(!anyAlive){hostFinish('lose');return}
  P.turn++;P.ph='m';P.ev=[];P.pat=[];P.dur=0;
  NET.publishBattle(P);
}
function hostFinish(res){
  const P=BT.P;P.ph='e';P.res=res;
  if(res==='win'){let xp=0,g=0;P.enc.forEach((e,i)=>{const d=edef(e);if(P.x[i]===1){xp+=d.xp;g+=d.g}else if(P.x[i]===2){xp+=Math.round(d.xp*.7);g+=Math.round(d.g*1.2)}});P.rew={xp,g}}
  NET.publishBattle(P);
}
// ------------------------------------------------ client logic
function battleUpdate(){
  const B=BT,L=B.L;L.t++;
  if(B.host)hostTick();
  else{const hp=NET.partyPresence(B.hostPid);const ps=hp&&hp.bt;
    if(!hp||(!ps&&L.t>120)){if(L.ph!=='end'&&L.ph!=='lost'){L.ph='lost';L.t=0}}
    else if(ps&&ps.id===B.P.id)B.P=ps}
  const P=B.P;
  for(const f of L.fx)f.t++;L.fx=L.fx.filter(f=>f.t<f.d);
  if(L.ph!=='bullet')boxTick();
  switch(L.ph){
    case'intro':if(L.t>45){L.ph='sync';L.t=0}break;
    case'lost':if(L.t>150||P_('z')){exitBattle('lost')}break;
    case'sync':case'wait':case'post':syncPhase();break;
    case'menu':menuUpdate();break;
    case'fight':fightUpdate();break;
    case'resolve':resolveUpdate();break;
    case'talk':if(L.t>90||P_('z')&&L.t>10){startBullets()}break;
    case'bullet':bulletPhase();break;
    case'end':endUpdate();break;
  }
  if(!B.solo&&FR%4===0&&L.ph==='bullet')NET.partyPatch({sl:[Math.round(SOUL.x),Math.round(SOUL.y)]});
}
function syncPhase(){
  const B=BT,L=B.L,P=B.P;
  if((P.ph==='b'||P.ph==='e')&&L.played!==P.turn){L.played=P.turn;L.ph='resolve';L.ev=0;L.evT=0;L.t=0;L.tpg=0;return}
  if(P.ph==='e'&&L.played===P.turn&&L.ph!=='end'){L.ph='end';L.t=0;L.endStep=0;return}
  if(P.ph==='m'&&L.turnDone!==P.turn){
    if(S.hp<=0){submitAct({k:'x'});return}
    L.ph='menu';L.sub=null;L.t=0;L.flav=pickFlav();setBox(288,64,160,144);return}
}
function pickFlav(){const P=BT.P;const al=aliveEn(P);if(!al.length)return'';const i=al[P.turn%al.length];const d=edef(P.enc[i]);
  if(P.sp[i]>=100)return d.n+' parece listo para irse.';
  if(P.turn===0)return(P.enc.length>1?d.n+' y compañía aparecen.':d.n+' bloquea el camino.');return d.flav?d.flav[P.turn%d.flav.length]:'...'}
function submitAct(a){
  const B=BT,L=B.L,P=B.P;a.id=P.id;a.t=P.turn;L.myAct=a;L.turnDone=P.turn;L.ph='wait';L.t=0;
  if(!B.solo||!B.host)NET.partyPatch({ba:a});
}
function submitDone(){
  const B=BT,L=B.L,P=B.P;const d={id:P.id,t:P.turn,g:Math.round(L.tpg),hp:S.hp,th:L.th||0};L.myDone=d;L.ph='post';L.t=0;
  NET.partyPatch({bd:d,hp:S.hp});
}
// ------------- menu
function menuUpdate(){
  const B=BT,L=B.L,P=B.P;
  if(L.sub){subUpdate();return}
  if(P_('left')){L.sel=(L.sel+5)%6;AU.sfx('blip')}
  if(P_('right')){L.sel=(L.sel+1)%6;AU.sfx('blip')}
  if(P_('z')){AU.sfx('sel');
    const s=L.sel;
    if(s===0)L.sub={k:'tgt',then:'fight',i:firstAlive()};
    else if(s===1)L.sub={k:'tgt',then:'act',i:firstAlive()};
    else if(s===2){const sk=skillsFor();L.sub={k:'skill',i:0,list:sk}}
    else if(s===3){if(!S.items.length){AU.sfx('no');L.flav='No llevas objetos.';return}L.sub={k:'item',i:0}}
    else if(s===4)L.sub={k:'mercy',i:0};
    else if(s===5)submitAct({k:'d'});
  }
}
function firstAlive(){const a=aliveEn(BT.P);return a.length?a[0]:0}
function subUpdate(){
  const B=BT,L=B.L,P=B.P,s=L.sub;
  const back=()=>{L.sub=s.prev||null};
  if(P_('x')){AU.sfx('blip');back();return}
  const nav=(n,vert)=>{if(P_(vert?'up':'left')||P_('up')){s.i=(s.i+n-1)%n;AU.sfx('blip')}if(P_(vert?'down':'right')||P_('down')){s.i=(s.i+1)%n;AU.sfx('blip')}};
  if(s.k==='tgt'){const al=aliveEn(P);if(!al.length){back();return}let k=al.indexOf(s.i);if(k<0)k=0;
    if(P_('up')||P_('left')){k=(k+al.length-1)%al.length;AU.sfx('blip')}if(P_('down')||P_('right')){k=(k+1)%al.length;AU.sfx('blip')}s.i=al[k];
    if(P_('z')){AU.sfx('sel');
      if(s.then==='fight'){startFight(s.i)}
      else if(s.then==='act'){L.sub={k:'act',tg:s.i,i:0,prev:s}}
      else if(s.then==='skill'){submitAct({k:'s',n:s.sk,tg:s.i,q:1.4})}}
    return}
  if(s.k==='act'){const d=edef(P.enc[s.tg]);const n=d.acts.length+1;nav(n,true);
    if(P_('z')){submitAct({k:'a',tg:s.tg,n:s.i-1})}return}
  if(s.k==='skill'){const n=s.list.length;if(!n){back();return}nav(n,true);
    if(P_('z')){const id=s.list[s.i],sk=SKILLS[id];if(P.tp<sk.tp){AU.sfx('no');return}
      if(sk.tg==='e'){L.sub={k:'tgt',then:'skill',sk:id,i:firstAlive(),prev:s}}
      else if(sk.tg==='a'||sk.tg==='d'){L.sub={k:'ally',sk:id,i:0,prev:s}}
      else submitAct({k:'s',n:id})}
    return}
  if(s.k==='ally'){const mem=P.mem;nav(mem.length,true);if(P_('z')){if(s.sk)submitAct({k:'s',n:s.sk,tg:mem[s.i]});else{const it=ITEMS[s.it];S.items.splice(s.ii,1);submitAct({k:'i',n:s.it,tg:mem[s.i]})}}return}
  if(s.k==='item'){const n=S.items.length;if(!n){back();return}nav(n,true);
    if(P_('z')){const id=S.items[s.i],it=ITEMS[id];if(it.tp||it.all||B.solo){S.items.splice(s.i,1);submitAct({k:'i',n:id,tg:NET.myPid()})}else L.sub={k:'ally',it:id,ii:s.i,i:0,prev:s}}return}
  if(s.k==='mercy'){nav(P.boss?1:2,true);if(P_('z'))submitAct({k:'m',n:s.i})}
}

      out.push({pid:pr.pid,peer:pr.pid,x:g.x,y:g.y,d:pr.d||0,fr:Math.floor(g.an)%4,lk:pr.lk,n:String(pr.n||'?').slice(0,12),ro:pr.ro,lv:pr.lv,st:pr.st,party:party.has(pr.pid),say:g.say,rm:pr.rm});
    }
    return out;
  },
  playerNear(x,y){for(const g of this.ghostsInRoom())if(Math.abs(g.x-x)<12&&Math.abs(g.y-6-y)<16)return Object.assign({},this.others().find(o=>o.pid===g.pid)||{},{peer:g.pid});return null},
  say(s){this.sayI++;this.lobbyPatch({say:{i:this.sayI+'-'+this.pid,s}},true)},
  lobbyPatch(patch,force){if(!this.room)return;this.room.presence(patch).catch(()=>{})},
  // ---------- requests
  invite(p){
    if(!this.party){this.createParty().then(()=>this.invite(p));return}
    this.myReq={to:p.pid||p.peer,k:'inv',c:this.partyCode,i:Math.random().toString(36).slice(2,8),at:Date.now()};
    this.lobbyPatch({rq:this.myReq},true);UI.toast('Invitación enviada a '+(p.n||'?'));
  },
  challenge(p){
    if(BT||DU)return;
    const code=Math.random().toString(36).slice(2,8);
    this.myReq={to:p.pid||p.peer,k:'pvp',c:code,i:Math.random().toString(36).slice(2,8),at:Date.now()};
    this.lobbyPatch({rq:this.myReq},true);UI.toast('Desafío enviado a '+(p.n||'?'));
  },
  async createParty(){
    if(!this.room)return;if(this.party)await this.leaveParty();
    const code=Math.random().toString(36).replace(/[^a-z0-9]/g,'').slice(0,4)||'abcd';
    await this.joinParty(code,true);
  },
  async joinParty(code,isNew){
    if(!this.room)return;code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);
    if(code.length<3){UI.toast('Código no válido','#f66');return}
    if(this.party)await this.leaveParty();
    try{this.party=await this.room.join('p-'+code)}catch(e){UI.toast('No se pudo unir al grupo','#f66');this.party=null;return}
    this.partyCode=code;this.pState={};this.partyPatch(Object.assign({pid:this.pid},this.infoPatch()));
    this.lobbyPatch({pt:code},true);
    UI.toast(isNew?'Grupo creado. Código: '+code.toUpperCase():'Te uniste al grupo '+code.toUpperCase());
    setTimeout(()=>{if(this.party&&this.partyCode===code&&this.partyMembers().length>3){UI.toast('Ese grupo está lleno (4/4)','#f66');this.leaveParty()}},2500);
  },
  async leaveParty(){if(this.party){try{await this.party.leave()}catch(e){}}this.party=null;this.partyCode=null;this.pState={};this.lobbyPatch({pt:null},true);UI.toast('Saliste del grupo','#aaa')},
  async startDuelFlow(code,opp){
    if(BT||DU)return;
    try{this.duel=await this.room.join('v-'+code)}catch(e){UI.toast('No se pudo iniciar el duelo','#f66');return}
    this.duelCode=code;this.duel.presence(Object.assign(duelInfo(),{dhp:null,act:null,done:null})).catch(()=>{});
    startDuel(code,opp);
  },
  leaveDuel(){if(this.duel){this.duel.leave().catch(()=>{})}this.duel=null;this.duelCode=null},
  infoPatch(){const i=myInfo();return{n:i.n,lk:i.lk,ro:i.ro,sb:i.sb||null,lv:i.lv,hp:i.hp,mh:i.mh,a:i.a,df:i.df,mg:i.mg,ch:i.ch,gr:i.gr,rm:S.room}},
  // ---------- per-frame
  tick(){
    if(!this.on||!S)return;
    // lobby presence
    if(FR%6===0){
      const st=GS==='title'||GS==='create'?'title':BT?'battle':DU?'duel':'world';
      const p={pid:this.pid,n:S.nick||'?',lk:S.look,ro:S.role,lv:S.lv,rm:S.room,x:Math.round(PL.x),y:Math.round(PL.y),d:PL.d,mv:PL.mv?1:0,st,pt:this.partyCode||null};
      if(this.myReq&&Date.now()-this.myReq.at>30000){this.myReq=null;p.rq=null}
      const j=JSON.stringify(p);if(j!==this.lastSent){this.lastSent=j;this.lobbyPatch(p)}
    }
    if(this.party&&FR%30===0){const ip=this.infoPatch();const changed=Object.keys(ip).some(k=>JSON.stringify(ip[k])!==JSON.stringify(this.pState[k]));if(changed)this.partyPatch(ip)}
    if(FR%10===0)this.scanRequests();
    // party battles
    if(this.party&&FR%5===0&&!DU){
      for(const m of this.partyMembers()){
        const bt=m.bt;if(!bt||bt.ph==='e'||this.doneBattles.has(bt.id)||!Array.isArray(bt.mem)||!bt.mem.includes(this.pid))continue;
        if(BT&&BT.P.id===bt.id)continue;
        if(BT&&BT.host&&BT.P.turn===0&&bt.id<BT.P.id&&BT.L.ph!=='end'){this.doneBattles.add(BT.P.id);BT=null;this.partyPatch({bt:null})}
        if(!BT&&(GS==='world')){this.doneBattles.add(bt.id);joinBattleAsMember(bt,m.pid);break}
      }
    }
    // prompts
    if(this.prompts.length&&GS==='world'&&!UI.busy()&&!BT&&!DU){const pr=this.prompts.shift();this.runPrompt(pr)}
  },
  scanRequests(){
    for(const pr of this.others()){
      const rq=pr.rq;
      if(rq&&rq.to===this.pid&&!this.seenReq[rq.i]){this.seenReq[rq.i]=1;this.prompts.push({from:pr,rq})}
      const ac=pr.ac;
      if(ac&&ac.to===this.pid&&this.myReq&&ac.c===this.myReq.c&&!this.seenReq['ac'+ac.i]){this.seenReq['ac'+ac.i]=1;
        if(ac.k==='pvp'&&ac.ok){this.myReq=null;this.lobbyPatch({rq:null},true);this.startDuelFlow(ac.c,pr.pid)}
        else if(ac.k==='pvp'){UI.toast((pr.n||'?')+' rechazó el duelo','#aaa');this.myReq=null;this.lobbyPatch({rq:null},true)}
        else if(ac.k==='inv'&&!ac.ok){UI.toast((pr.n||'?')+' rechazó la invitación','#aaa')}}
    }
  },
  async runPrompt({from,rq}){
    const n=String(from.n||'?').slice(0,12);
    if(rq.k==='inv'){const c=await choose(n+' te invita a su grupo. ¿Aceptar?',['Sí','No']);
      this.lobbyPatch({ac:{to:from.pid,k:'inv',c:rq.c,i:rq.i,ok:c===0?1:0}},true);
      if(c===0)await this.joinParty(rq.c)}
    else if(rq.k==='pvp'){const c=await choose(n+' (Nv '+(from.lv||1)+') te desafía a un DUELO. ¿Aceptar?',['¡Sí!','No']);
      this.lobbyPatch({ac:{to:from.pid,k:'pvp',c:rq.c,i:rq.i,ok:c===0?1:0}},true);
      if(c===0)this.startDuelFlow(rq.c,from.pid)}
  },
  // ---------- init
  async init(){
    try{
      if(!window.claude||typeof window.claude.use!=='function'){
        const cfg=window.UT_CONFIG||{};
        if(cfg.supabaseUrl&&cfg.supabaseKey&&window.supabase&&window.supabase.createClient){
          const room=supaRoomFactory(cfg.supabaseUrl,cfg.supabaseKey,this.pid);this.room=room;this.backend='supabase';
          const ok=await Promise.race([room.ready,new Promise(r=>setTimeout(()=>r(false),8000))]);
          this.on=!!ok;room.onConnection(c=>{this.connected=c;if(c)this.on=true});
        }
        this.dbDone=true;return}
      const[room,user,db]=await Promise.all([claude.use('room'),claude.use('user'),claude.use('db')]);
      this.room=room;this.user=user;this.db=db;
      if(user){try{this.uid=await user.id()}catch(e){}}
      if(db&&this.uid){dbRef=db.doc('data/users/'+this.uid+'/save');
        try{const snap=await Promise.race([dbRef.get(),new Promise((_,rej)=>setTimeout(()=>rej('t'),6000))]);if(snap&&snap.exists){const d=snap.data();if(d&&d.j){const rs=JSON.parse(d.j);this.remoteSave=rs}}}catch(e){}}
      this.dbDone=true;
      if(room){this.on=true;room.onConnection(c=>{this.connected=c},()=>{});room.onPeers(()=>{},e=>{this.on=false})}
    }catch(e){this.dbDone=true}
  }
};

// ---------- Supabase Realtime adapter (GitHub Pages): same shape as the claude.ai room capability
// Slow fields go through presence (quota-friendly); fast fields (position, soul, duel hp) through broadcast.
const FAST_KEYS=new Set(['x','y','d','mv','sl','dhp']);
function supaRoomFactory(url,key,pid){
  const client=window.supabase.createClient(url,key,{realtime:{params:{eventsPerSecond:20}}});
  const mk=(name,fastMs)=>{
    const ch=client.channel('ut-'+name,{config:{presence:{key:pid},broadcast:{self:false}}});
    let slow={},fast={},slowSent='',fastSent='',tSlow=null,tFast=null,lastSlow=0,lastFast=0,ok=false,meta={},fastOf={},cache=[];const conn=[];
    const rebuild=()=>{const out=[];const seen=new Set();
      for(const k in meta){seen.add(k);const p=Object.assign({},meta[k],k===pid?fast:fastOf[k]||{});out.push({peer:k,presence:Object.freeze(p),isMe:k===pid,sameTab:k===pid,kind:'viewer',guest:false})}
      if(!seen.has(pid))out.push({peer:pid,presence:Object.freeze(Object.assign({},slow,fast)),isMe:true,sameTab:true,kind:'viewer',guest:false});
      cache=out};
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();const prev=meta;meta={};for(const k in st){const a=st[k];const m=a&&a[a.length-1];if(!m)continue;const p=Object.assign({},m);delete p.presence_ref;meta[k]=p}
      for(const k in fastOf)if(!meta[k])delete fastOf[k];
      if(Object.keys(meta).some(k=>k!==pid&&!prev[k])){fastSent='';if(!tFast)tFast=setTimeout(flushFast,300)}
      rebuild()});
    ch.on('broadcast',{event:'f'},({payload})=>{if(!payload||typeof payload.k!=='string'||payload.k===pid)return;fastOf[payload.k]=Object.assign(fastOf[payload.k]||{},payload.v||{});rebuild()});
    const flushSlow=()=>{tSlow=null;if(!ok)return;const j=JSON.stringify(slow);if(j===slowSent)return;slowSent=j;lastSlow=Date.now();ch.track(JSON.parse(j)).catch(()=>{slowSent=''})};
    const flushFast=()=>{tFast=null;if(!ok)return;const j=JSON.stringify(fast);if(j===fastSent)return;fastSent=j;lastFast=Date.now();ch.send({type:'broadcast',event:'f',payload:{k:pid,v:JSON.parse(j)}}).catch(()=>{})};
    const ready=new Promise(res=>{ch.subscribe(s=>{
      if(s==='SUBSCRIBED'){ok=true;slowSent='';fastSent='';flushSlow();flushFast();conn.forEach(f=>f(true));res(true)}
      else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){ok=false;conn.forEach(f=>f(false));res(false)}})});
    const api={name,ready,
      presence(patch){let s=false,f=false;for(const k in patch){const tgt=FAST_KEYS.has(k)?fast:slow;if(FAST_KEYS.has(k))f=true;else s=true;if(patch[k]===null||patch[k]===undefined)delete tgt[k];else tgt[k]=patch[k]}
        if(s&&!tSlow)tSlow=setTimeout(flushSlow,Math.max(0,350-(Date.now()-lastSlow)));
        if(f&&!tFast)tFast=setTimeout(flushFast,Math.max(0,fastMs-(Date.now()-lastFast)));
        rebuild();return Promise.resolve()},
      peers(){return cache},
      onPeers(){return()=>{}},
      onConnection(fn){conn.push(fn);setTimeout(()=>fn(ok),0);return()=>{}},
      connected(){return ok},
      async leave(){clearTimeout(tSlow);clearTimeout(tFast);ok=false;try{await ch.untrack()}catch(e){}try{await client.removeChannel(ch)}catch(e){}},
      async join(n){const r=mk(n,170);const okj=await Promise.race([r.ready,new Promise(res=>setTimeout(()=>res(false),9000))]);if(!okj){r.leave();throw{code:'upstream_error'}}return r}};
    const ka=setInterval(()=>{if(ok&&Object.keys(fast).length){fastSent='';flushFast()}},4000);
    const lv=api.leave;api.leave=async()=>{clearInterval(ka);return lv()};
    rebuild();return api};
  return mk('lobby',250);
}

const EN_TXT={s:['Claude baja la mirada y sonríe.','"No necesitábamos pelear. Nunca lo necesitamos."','Las enredaderas de código se vuelven suaves, verdes, vivas.','Los archivos con dientes recuerdan sus nombres.','En la aldea, Nuez y Avellana ven el primer amanecer con colores en mucho tiempo.','El bosque y el código aprendieron a vivir juntos.','Gracias a ti. Y a quienes caminaron contigo.'],

// ---------------- loop
let acc=0,last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){acc-=1000/60;step()}
  draw();requestAnimationFrame(frame);
}
function step(){
  FR++;
  if(typing){clearKeys();return}
  if(UI.busy()&&GS!=='battle'&&GS!=='duel')UI.update();
  else switch(GS){
    case'title':titleUpdate();break;
    case'intro':introUpdate();break;
    case'world':worldUpdate();tryPushCheck();break;
    case'battle':battleUpdate();break;
    case'duel':duelUpdate();break;
    case'gameover':gameoverUpdate();break;
    case'ending':endingUpdate();break;
  }
  if((GS==='battle'||GS==='duel')&&UI.stack.length)UI.update();
  if(S&&GS==='world'&&FR%60===0)S.t=Date.now(),S.playT=(S.playT||0)+1;

}
